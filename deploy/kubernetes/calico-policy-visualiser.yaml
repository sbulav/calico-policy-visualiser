apiVersion: apps/v1
kind: Deployment
metadata:
  name: calico-policy-visualiser
  labels:
    app.kubernetes.io/name: calico-policy-visualiser
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calico-policy-visualiser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calico-policy-visualiser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/sbulav/calico-policy-visualiser:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: calico-policy-visualiser
  labels:
    app.kubernetes.io/name: calico-policy-visualiser
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calico-policy-visualiser
  ports:
    - name: http
      port: 80
      targetPort: http
